[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["inspirations"]
default-members = ["crates/crabfin"]

[workspace.package]
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/sayeed205/crabfin"
authors = ["Sayed Ahmed <sayeed205@gmail.com>"]

[workspace.dependencies]
#
# Workspace member crates
#

crabfin = { path = "crates/crabfin" }
jellyfin = { path = "crates/jellyfin" }
ui = { path = "crates/ui" }
theme = { path = "crates/theme" }
settings = { path = "crates/settings" }
credentials = { path = "crates/credentials" }
assets = { path = "crates/assets" }
video_player = { path = "crates/video_player" }

#
# UI Framework
#

gpui = "0.2"

#
# Async Runtime
#

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

#
# HTTP Client
#

reqwest = { version = "0.13", features = ["json", "rustls"] }

#
# Serialization
#

serde = { version = "1", features = ["derive"] }
serde_json = "1"

#
# Error Handling
#

anyhow = "1"
thiserror = "2"

#
# URL Encoding
#

urlencoding = "2"

#
# Logging
#

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

#
# Date/Time
#

chrono = { version = "0.4", features = ["serde"] }

#
# ID Generation
#

cuid2 = "0.1"

#
# Material Design Colors
#

material-colors = "0.4"

#
# Image Processing
#

image = "0.25"

#
# Platform-specific
#

dirs = "6"

#
# Caching
#

lru = "0.12"

#
# Secure credential storage
#

keyring = "3"
oo7 = "0.5"

#
# File watching
#

notify = "8"

#
# Utilities
#

uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"

#
# Wallpaper detection
#

wallpaper = "3"
unicode-segmentation = "1.12.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
